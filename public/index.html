<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Meu Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
    input, button { padding: 6px 10px; font-size: 14px; }

    #login {
      display: flex; gap: 6px; align-items: center;
    }

    #online { padding: 0; }
    #online li {
      cursor: pointer; padding: 8px;
      border: 1px solid #ccc; margin: 4px 0;
      list-style: none; border-radius: 4px;
    }
    #online li:hover { background: #f0f0f0; }

    #chat {
      border: 1px solid #333; height: 300px;
      overflow-y: auto; padding: 10px; margin-top: 10px;
      background: #fafafa; border-radius: 4px;
    }
    .msg { margin: 4px 0; font-size: 14px; }
    .msg .hora { color: #999; font-size: 11px; margin-left: 6px; }
    .eu { color: #1976d2; }
    .ele { color: #2e7d32; }
    .sistema { color: #888; font-style: italic; text-align: center; }

    #digitando {
      color: #666; font-style: italic; font-size: 12px;
      height: 16px; margin-top: 4px;
    }

    #barra {
      display: flex; gap: 6px; margin-top: 6px;
    }
    #barra input { flex: 1; }

    #pedido {
      display: none; border: 1px solid red; padding: 8px;
      margin-top: 10px; border-radius: 4px;
      background: #fff5f5;
    }
  </style>
</head>
<body>
  <h2>Meu Chat</h2>

  <div id="login">
    <input id="nome" placeholder="Seu nome" autofocus>
    <button onclick="entrar()">Entrar</button>
    <button onclick="esquecer()" title="Limpar campo">🗑️</button>
  </div>

  <div id="app" style="display:none">
    <div style="display:flex; justify-content:space-between; align-items:center">
      <h3 style="margin: 8px 0">Online:</h3>
      <div>
        <button id="btnLimpar" onclick="limparHistorico()" style="display:none">
          🧹 Limpar histórico
        </button>
        <button id="btnDesconectar" onclick="encerrar()" style="display:none">
          ❌ Encerrar conversa
        </button>
        <button onclick="sair()" title="Sair da conta">🚪 Sair</button>
      </div>
    </div>
    <ul id="online"></ul>

    <div id="chat"></div>
    <div id="digitando"></div>

    <div id="barra">
      <input id="msg" placeholder="Digite..." disabled>
      <button id="enviar" disabled>Enviar</button>
    </div>

    <div id="pedido">
      <span id="pedido-texto"></span>
      <button onclick="aceitar()">Aceitar</button>
      <button onclick="recusar()">Recusar</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
