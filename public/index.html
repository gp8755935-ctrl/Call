<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Meu Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 10px; }
    input, button { padding: 8px 12px; font-size: 14px; margin: 4px 0; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { cursor: pointer; border: none; border-radius: 4px; background: #1976d2; color: white; }
    button:hover { background: #1565c0; }
    button.secundario { background: #eee; color: #333; }
    button.secundario:hover { background: #ddd; }
    button.perigo { background: #c62828; }
    button.perigo:hover { background: #b71c1c; }
    button.mini { padding: 4px 10px; font-size: 12px; }

    .tela { display: none; }
    .tela.ativa { display: block; }

    .abas-auth { display: flex; gap: 4px; margin-bottom: 12px; }
    .aba-auth { flex: 1; padding: 10px; text-align: center; cursor: pointer;
                border-radius: 4px 4px 0 0; background: #eee; }
    .aba-auth.ativa { background: #1976d2; color: white; }

    .topo { display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #ddd; }

    .abas { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 2px solid #ddd; }
    .aba { padding: 10px 16px; cursor: pointer; border-radius: 4px 4px 0 0;
           background: #f0f0f0; border-bottom: 3px solid transparent; }
    .aba.ativa { background: white; border-bottom: 3px solid #1976d2; font-weight: bold; }
    .aba .badge { background: #c62828; color: white; border-radius: 10px; padding: 2px 6px;
                  font-size: 11px; margin-left: 4px; }

    .painel { display: none; }
    .painel.ativo { display: block; }

    .lista { padding: 0; margin: 8px 0; }
    .lista li { list-style: none; padding: 10px; border: 1px solid #e0e0e0;
                margin: 6px 0; border-radius: 6px;
                display: flex; justify-content: space-between; align-items: center; }
    .lista li:hover { background: #f9f9f9; }
    .lista li.clicavel { cursor: pointer; }

    .info { display: flex; flex-direction: column; flex: 1; min-width: 0; }
    .nome { font-weight: bold; }
    .email { font-size: 12px; color: #888; }

    .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
              margin-right: 6px; }
    .online { background: #2e7d32; }
    .offline { background: #aaa; }

    .acoes { display: flex; gap: 4px; flex-shrink: 0; }

    .preview { color: #666; font-size: 13px; white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; max-width: 300px; }
    .nao-lidas { background: #c62828; color: white; border-radius: 10px;
                 padding: 2px 8px; font-size: 12px; font-weight: bold; }
    .hora-lista { color: #aaa; font-size: 11px; }

    /* Chat / conversa */
    #tela-conversa { display: none; }
    #tela-conversa.ativa { display: block; }

    .topo-conversa { display: flex; align-items: center; gap: 12px;
                     padding-bottom: 8px; border-bottom: 1px solid #ddd; margin-bottom: 10px; }
    .topo-conversa h3 { margin: 0; flex: 1; }

    #chat {
      border: 1px solid #333; height: 400px;
      overflow-y: auto; padding: 10px; background: #fafafa; border-radius: 4px;
    }
    .msg { margin: 6px 0; font-size: 14px; }
    .msg .hora { color: #999; font-size: 11px; margin-left: 6px; }
    .eu { color: #1976d2; text-align: right; }
    .ele { color: #2e7d32; }
    .sistema { color: #888; font-style: italic; text-align: center; }

    #barra { display: flex; gap: 6px; margin-top: 8px; }
    #barra input { flex: 1; }

    .erro { color: #c00; font-size: 13px; min-height: 18px; margin: 6px 0; }
    .vazio { text-align: center; color: #888; font-style: italic; padding: 20px; }
  </style>
</head>
<body>

  <!-- ============ TELA DE LOGIN / CADASTRO ============ -->
  <div id="tela-auth" class="tela ativa">
    <h2>Meu Chat</h2>

    <div class="abas-auth">
      <div id="aba-login" class="aba-auth ativa" onclick="mudarAbaAuth('login')">Entrar</div>
      <div id="aba-cadastro" class="aba-auth" onclick="mudarAbaAuth('cadastro')">Criar conta</div>
    </div>

    <div id="form-login">
      <input id="login-email" type="email" placeholder="Email">
      <input id="login-senha" type="password" placeholder="Senha">
      <div class="erro" id="login-erro"></div>
      <button onclick="fazerLogin()" style="width:100%">Entrar</button>
    </div>

    <div id="form-cadastro" style="display:none">
      <input id="cad-nome" type="text" placeholder="Seu nome">
      <input id="cad-email" type="email" placeholder="Email">
      <input id="cad-senha" type="password" placeholder="Senha (mín 6)">
      <div class="erro" id="cad-erro"></div>
      <button onclick="fazerCadastro()" style="width:100%">Criar conta</button>
    </div>
  </div>

  <!-- ============ TELA PRINCIPAL ============ -->
  <div id="tela-app" class="tela">
    <div class="topo">
      <strong id="nome-usuario">...</strong>
      <button class="secundario" onclick="fazerLogout()">Sair</button>
    </div>

    <div class="abas">
      <div id="tab-conversas" class="aba ativa" onclick="mudarAba('conversas')">
        💬 Conversas <span id="badge-dm" class="badge" style="display:none">0</span>
      </div>
      <div id="tab-amigos" class="aba" onclick="mudarAba('amigos')">
        👥 Amigos <span id="badge-pedidos" class="badge" style="display:none">0</span>
      </div>
      <div id="tab-buscar" class="aba" onclick="mudarAba('buscar')">🔍 Buscar</div>
    </div>

    <!-- PAINEL: CONVERSAS -->
    <div id="painel-conversas" class="painel ativo">
      <h3>Minhas conversas</h3>
      <ul id="lista-conversas" class="lista"></ul>
    </div>

    <!-- PAINEL: AMIGOS -->
    <div id="painel-amigos" class="painel">
      <h3>Pedidos recebidos</h3>
      <ul id="lista-pedidos" class="lista"></ul>

      <h3>Meus amigos</h3>
      <ul id="lista-amigos" class="lista"></ul>

      <h3>Pedidos enviados</h3>
      <ul id="lista-enviados" class="lista"></ul>
    </div>

    <!-- PAINEL: BUSCAR -->
    <div id="painel-buscar" class="painel">
      <h3>Buscar usuários</h3>
      <input id="busca-input" placeholder="Digite nome ou email..."
             oninput="buscarUsuarios()">
      <ul id="lista-busca" class="lista"></ul>
    </div>
  </div>

  <!-- ============ TELA DE CONVERSA ============ -->
  <div id="tela-conversa">
    <div class="topo-conversa">
      <button class="secundario mini" onclick="voltarConversas()">← Voltar</button>
      <h3 id="nome-conversa">...</h3>
      <span id="status-conversa"></span>
    </div>

    <div id="chat"></div>

    <div id="barra">
      <input id="msg" placeholder="Digite...">
      <button id="enviar" onclick="enviarMensagem()">Enviar</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
