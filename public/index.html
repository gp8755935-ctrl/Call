<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Meu Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; }
    input, button { padding: 8px 12px; font-size: 14px; margin: 4px 0; }
    input { width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { cursor: pointer; border: none; border-radius: 4px; background: #1976d2; color: white; }
    button:hover { background: #1565c0; }
    button.secundario { background: #eee; color: #333; }
    button.secundario:hover { background: #ddd; }

    .tela { display: none; }
    .tela.ativa { display: block; }

    .abas { display: flex; gap: 4px; margin-bottom: 12px; }
    .aba { flex: 1; padding: 10px; text-align: center; cursor: pointer; border-radius: 4px 4px 0 0;
           background: #eee; }
    .aba.ativa { background: #1976d2; color: white; }

    #online { padding: 0; }
    #online li {
      cursor: pointer; padding: 8px;
      border: 1px solid #ccc; margin: 4px 0;
      list-style: none; border-radius: 4px;
    }
    #online li:hover { background: #f0f0f0; }

    #chat {
      border: 1px solid #333; height: 300px;
      overflow-y: auto; padding: 10px; margin-top: 10px;
      background: #fafafa; border-radius: 4px;
    }
    .msg { margin: 4px 0; font-size: 14px; }
    .msg .hora { color: #999; font-size: 11px; margin-left: 6px; }
    .eu { color: #1976d2; }
    .ele { color: #2e7d32; }
    .sistema { color: #888; font-style: italic; text-align: center; }

    #digitando { color: #666; font-style: italic; font-size: 12px; height: 16px; margin-top: 4px; }

    #barra { display: flex; gap: 6px; margin-top: 6px; }
    #barra input { flex: 1; }

    #pedido { display: none; border: 1px solid red; padding: 8px; margin-top: 10px;
              border-radius: 4px; background: #fff5f5; }

    .erro { color: #c00; font-size: 13px; min-height: 18px; margin: 6px 0; }
    .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;
            padding-bottom: 8px; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>

  <!-- ============ TELA DE LOGIN / CADASTRO ============ -->
  <div id="tela-auth" class="tela ativa">
    <h2>Meu Chat</h2>

    <div class="abas">
      <div id="aba-login" class="aba ativa" onclick="mudarAba('login')">Entrar</div>
      <div id="aba-cadastro" class="aba" onclick="mudarAba('cadastro')">Criar conta</div>
    </div>

    <!-- Login -->
    <div id="form-login">
      <input id="login-email" type="email" placeholder="Email">
      <input id="login-senha" type="password" placeholder="Senha">
      <div class="erro" id="login-erro"></div>
      <button onclick="fazerLogin()" style="width:100%">Entrar</button>
    </div>

    <!-- Cadastro -->
    <div id="form-cadastro" style="display:none">
      <input id="cad-nome" type="text" placeholder="Seu nome">
      <input id="cad-email" type="email" placeholder="Email">
      <input id="cad-senha" type="password" placeholder="Senha (mín 6)">
      <div class="erro" id="cad-erro"></div>
      <button onclick="fazerCadastro()" style="width:100%">Criar conta</button>
    </div>
  </div>

  <!-- ============ TELA DO CHAT ============ -->
  <div id="tela-app" class="tela">
    <div class="topo">
      <strong id="nome-usuario">...</strong>
      <button class="secundario" onclick="fazerLogout()">Sair</button>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center">
      <h3 style="margin: 8px 0">Online:</h3>
      <div>
        <button id="btnLimpar" onclick="limparHistorico()" style="display:none">🧹 Limpar</button>
        <button id="btnDesconectar" onclick="encerrar()" style="display:none">❌ Encerrar</button>
      </div>
    </div>
    <ul id="online"></ul>

    <div id="chat"></div>
    <div id="digitando"></div>

    <div id="barra">
      <input id="msg" placeholder="Digite..." disabled>
      <button id="enviar" disabled>Enviar</button>
    </div>

    <div id="pedido">
      <span id="pedido-texto"></span>
      <button onclick="aceitar()">Aceitar</button>
      <button onclick="recusar()" class="secundario">Recusar</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
